# Geo-Network Map Data Pipeline Configuration
# ============================================
# This file defines the target geographic region and data collection parameters.
# The RL training system reads data/processed/geo_network_map.parquet which is
# built by running: python data/pipeline/run_pipeline.py

region:
  name: "Koramangala, Bangalore, India"

  # Center coordinates of the target region
  center_latitude: 12.9352
  center_longitude: 77.6245

  # Coverage area (kilometers)
  width_km: 1.0
  height_km: 1.0

grid:
  # Cell resolution in meters (100m = 50x50 grid for 5km x 5km)
  cell_size_meters: 100

  # Derived: grid_width = ceil(width_km * 1000 / cell_size_meters)
  # Derived: grid_height = ceil(height_km * 1000 / cell_size_meters)

osm:
  # Overpass API endpoint (public, no key required)
  endpoint: "https://overpass-api.de/api/interpreter"

  # OSM feature types to mark as obstacles
  obstacle_tags:
    buildings: true        # building=* → is_obstacle
    water: true            # natural=water, landuse=reservoir → is_obstacle
    industrial: false      # landuse=industrial → is_obstacle (optional)

  # Request timeout (seconds)
  timeout: 120
  max_retries: 3

terrain:
  # OpenTopography API endpoint
  endpoint: "https://portal.opentopography.org/API/globaldem"

  # DEM dataset to use: SRTMGL1 (30m), SRTMGL3 (90m), AW3D30 (30m)
  dem_type: "SRTMGL1"

  # API key — fill this in before running (get free key at opentopography.org)
  api_key: "YOUR_OPENTOPOGRAPHY_API_KEY"

towers:
  # OpenCelliD API endpoint
  endpoint: "https://opencellid.org/cell/getInArea"

  # Alternative bulk download (recommended for large areas)
  bulk_download_url: "https://opencellid.org/ocid/downloads"

  # API key — fill this in before running (get free key at opencellid.org)
  api_key: "YOUR_OPENCELLID_API_KEY"

  # MCC for India = 404 (BSNL), 405 (other operators)
  # Leave empty to get all operators in the region
  mcc_filter: []

  # Radio types to include: GSM, UMTS, LTE, NR
  radio_filter: ["LTE", "NR", "UMTS", "GSM"]

  # Maximum tower search radius (meters) for each grid cell
  search_radius_meters: 5000

network_estimation:
  # Physics-based path-loss signal estimation model
  # Reference: ITU-R P.1546 / log-distance model

  # Transmit power per radio type (dBm)
  tx_power:
    NR: 43.0       # 5G NR macro cell
    LTE: 43.0      # 4G LTE macro cell
    UMTS: 43.0     # 3G UMTS
    GSM: 43.0      # 2G GSM

  # Carrier frequency per radio type (MHz)
  frequency_mhz:
    NR: 3500.0
    LTE: 2100.0
    UMTS: 2100.0
    GSM: 900.0

  # Additional shadowing/penetration margin (dB)
  shadow_margin_db:
    NR: 8.0
    LTE: 8.0
    UMTS: 10.0
    GSM: 12.0

  # Path-loss exponent (2.0 = free space, 3.0-4.5 = urban)
  path_loss_exponent: 3.5

  # Noise floor (dBm) for SINR computation
  noise_floor_dbm: -100.0

  # Receiver noise bandwidth (MHz)
  bandwidth_mhz:
    NR: 100.0
    LTE: 20.0
    UMTS: 5.0
    GSM: 0.2

  # Minimum detectable RSSI (below this = no signal)
  min_rssi_dbm: -120.0

output:
  parquet_path: "data/processed/geo_network_map.parquet"
  metadata_path: "data/processed/geo_network_metadata.json"
  raw_osm_path: "data/raw/osm/"
  raw_terrain_path: "data/raw/terrain/"
  raw_towers_path: "data/raw/towers/"

  # Save intermediate processing files for debugging
  save_intermediates: true
